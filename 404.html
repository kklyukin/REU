<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · REMMMEDIES REU</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03244D">
<!-- This page is intentionally self-contained: GitHub Pages can serve it from
     any missing path, so it must not depend on a stylesheet path resolving. -->
<style>
:root{--ground:#F6F6F3;--ink:#101C27;--ink-2:#4A5B69;--orange:#DD550C;--rule:#D9DDD8}
@media (prefers-color-scheme:dark){:root{--ground:#0B131A;--ink:#E7ECEF;--ink-2:#A8B6C1;--orange:#FF8447;--rule:#243441}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 24px;
  background:var(--ground);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.box{max-width:52ch;text-align:center}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,44px);
  letter-spacing:-.02em;margin:10px 0 0;line-height:1.15}
p.msg{color:var(--ink-2);margin:14px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
a.btn{display:inline-block;font-size:14.5px;font-weight:600;padding:12px 20px;
  border-radius:2px;text-decoration:none;border:1px solid transparent}
a.primary{background:var(--orange);color:#fff}
a.quiet{border-color:var(--rule);color:var(--ink)}
a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>
<main class="box">
  <p class="eyebrow">Error 404</p>
  <h1>This page doesn't exist.</h1>
  <p class="msg">The link may be out of date, or we may have moved something. Everything else is still where it was.</p>
  <p class="row">
    <a class="btn primary" href="./">Go to the home page</a>
    <a class="btn quiet" href="./apply.html">Application information</a>
  </p>
</main>
</body>
</html>
